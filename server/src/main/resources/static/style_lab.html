<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Style Lab</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
  canvas { display: block; image-rendering: pixelated; }
  #card { position: fixed; right: 6%; bottom: 17%; text-align: right; pointer-events: none; z-index: 5; }
  #card .name { font-family: Anton, 'Inter Display Black', Impact, sans-serif; font-size: 84px; line-height: 0.9; letter-spacing: 1px; color: #f2c230;
                text-shadow: 4px 4px 0 #8c1b10, 0 0 30px rgba(0,0,0,0.6); text-transform: uppercase; }
  #card .sub { margin-top: 10px; font-family: 'Courier Prime', 'Courier 10 Pitch', monospace; font-size: 19px; color: #f3e6c8; text-shadow: 2px 2px 0 #000; max-width: 560px; }
  #chapter { position: fixed; left: 6%; top: 15%; text-align: left; pointer-events: none; z-index: 5; font-family: 'Courier Prime', 'Courier 10 Pitch', monospace; color: #f3e6c8; text-shadow: 2px 2px 0 #000; }
  #chapter b { display: block; font-family: Anton, 'Inter Display Black', Impact, sans-serif; font-weight: 400; font-size: 34px; color: #f2c230; letter-spacing: 2px; }
  #hud { position: fixed; left: 16px; bottom: 14px; display: flex; gap: 8px; z-index: 6; }
  #hud button { min-height: 40px; padding: 0 16px; background: #120c08; color: #f3e6c8; border: 2px solid #3a2a1c; font-family: 'Courier Prime', monospace; font-size: 14px; cursor: pointer; }
  #hud button.on { border-color: #f2c230; color: #f2c230; }
  body.terminal #card .name { color: #f6dc72; text-shadow: 4px 4px 0 #5c1208; }
</style>
<script type="importmap">{ "imports": { "three": "./vendor/three/build/three.module.js", "three/addons/": "./vendor/three/examples/jsm/" } }</script>
</head>
<body>
<div id="chapter">CHAPTER ONE<b>THE LAESTRYGONIAN HARBOUR</b></div>
<div id="card"><div class="name">Odysseus</div><div class="sub">King of Ithaca. Sacker of Troy.<br>Ten years late. Bad at directions.</div></div>
<div id="hud"></div>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { Stylizer, LOOKS } from "./js/style/stylizer.js";
import { buildLab } from "./js/style/labScene.js";

const params = new URLSearchParams(location.search);
const renderer = new THREE.WebGLRenderer({ antialias: false });
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;
renderer.setPixelRatio(1);
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(38, 1, 0.1, 1200);
const lab = buildLab(scene);
const style = new Stylizer(renderer, scene, camera, { look: +(params.get("look") || 0) });

const SHOTS = {
  hero: { pos: [-6.3, 1.45, 7.2], look: [-3.7, 3.0, -1.4] },          // low angle, Tarantino "trunk shot" feel
  wide: { pos: [2, 6.5, 15], look: [-1, 3, -20] },
  top: { pos: [-4, 30, 4.01], look: [-4, 0, 4] }
};
const controls = new OrbitControls(camera, renderer.domElement);
function shot(n) { const s = SHOTS[n]; camera.position.set(...s.pos); controls.target.set(...s.look); controls.update(); }
function look(i) {
  style.setLook(i);
  document.body.classList.toggle("terminal", i === 2);
  document.querySelectorAll("#hud button[data-look]").forEach(b => b.classList.toggle("on", +b.dataset.look === i));
}
const hud = document.getElementById("hud");
LOOKS.forEach((l, i) => { const b = document.createElement("button"); b.textContent = String.fromCharCode(65 + i) + " · " + l.name; b.dataset.look = i; b.onclick = () => look(i); hud.appendChild(b); });
Object.keys(SHOTS).forEach(n => { const b = document.createElement("button"); b.textContent = n; b.onclick = () => shot(n); hud.appendChild(b); });

function resize() { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); style.resize(innerWidth, innerHeight); }
addEventListener("resize", resize);
resize(); shot(params.get("shot") || "hero"); look(+(params.get("look") || 0));

let time = 0;
const frame = dt => { time += dt; lab.update(time); controls.update(); style.render(time); };
window.__shot = n => { const [s, l] = n.split("-"); shot(s); look(+l); };
window.__frames = (n, dt = 1 / 30) => { for (let i = 0; i < n; i++) frame(dt); };
if (!params.get("capture")) { const clock = new THREE.Clock(); renderer.setAnimationLoop(() => frame(Math.min(clock.getDelta(), 0.1))); }
window.__ready = true;
</script>
</body>
</html>
