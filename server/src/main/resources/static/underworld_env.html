<meta charset="UTF-8">

<style>
  /* THE ATLAS OF LAST VOYAGES: night indigo, ivory, antique gold, route cyan; ember red for danger only */
  :root { --sun: #f1e8d2; --ink: #111522; --blood: #c64a36; --cobalt: #57b9d1; --paper: #f1e8d2; --night: #101a31; --brass: #d8a84e; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--night); color: var(--paper); font-family: 'Courier Prime', monospace; }
  canvas { display: block; }
  #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: var(--night); z-index: 40; transition: opacity 1s; }
  #loading h1 { margin: 0; font-family: Anton, Impact, sans-serif; font-weight: 400; letter-spacing: 4px; font-size: 34px; color: var(--brass); }
  #loading p { margin: 0; color: var(--paper); font-size: 15px; }

  /* the chapter mark and the three doors: the shared menu in js/ui/tokens.css (.odx-title, .odx-doors), dressed there for this island */

  /* the prologue: typed title cards on black */
  #lore { position: fixed; inset: 0; z-index: 33; background: var(--night); display: none; flex-direction: column; justify-content: center; padding: 0 12vw; pointer-events: none; }
  #lore.on { display: flex; }
  #lore p { margin: 0; max-width: 46ch; font-family: 'Courier Prime', monospace; font-weight: 700; font-size: clamp(22px, 2.7vw, 38px); line-height: 1.35; color: var(--paper); min-height: 2.7em; }
  #lore p.red { font-family: Anton, Impact, sans-serif; font-weight: 400; font-size: clamp(44px, 7vw, 96px); letter-spacing: 2px; color: var(--blood); line-height: 1; }
  #lore p::after { content: "▌"; color: var(--brass); animation: blink 0.8s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { #lore p::after { animation: none; } .door { transition: none; } }

  #skip { position: fixed; right: 18px; bottom: 16px; z-index: 35; min-height: 40px; padding: 0 16px; background: rgba(16, 26, 49, 0.88); color: var(--paper);
          border: 1px solid #8b7448; border-radius: 4px; font-family: 'Courier Prime', monospace; font-size: 13px; letter-spacing: 1px; cursor: pointer; display: none; }
  #skip.on { display: block; }
  @media (min-width: 901px) { body.board-on #skip { right: calc(var(--pw, 520px) + 20px); bottom: calc(var(--board-h, 210px) + 22px); } }
  #fast { position: fixed; inset: 0; z-index: 34; background: var(--night); display: none; align-items: center; justify-content: center;
          font-family: Anton, Impact, sans-serif; font-size: 34px; letter-spacing: 6px; color: var(--brass); }
  #fast.on { display: flex; }
</style>

<body>
<div id="loading"><h1>THE OFFICE OF HADES</h1><p>please take a number…</p></div>
<div id="title" class="odx-title"><span class="k">CHAPTER FOUR</span><span class="t">THE DEAD <em>TAKE A NUMBER</em></span></div>

      <span class="what">The linear queue and its fake FULL, the circular queue that fixes it, a deque and a priority queue. C, line by line. Nothing is graded.</span><span class="prog" id="prog-lesson">11 lessons</span></button>

<script type="module">
import * as THREE from "three";
import { World } from "./js/engine/world.js";
import { panelW } from "./js/learn/panelWidth.js";
import { Director } from "./js/engine/director.js";
import { sound } from "./js/engine/sound.js";
import { installUI } from "./js/ui/ui.js";
import { icon } from "./js/ui/icons.js";
import { Comic } from "./js/engine/comic.js";
import { Hero } from "./js/engine/hero.js";
import { nameCard } from "./js/story/tags.js";
import { buildHall, Hall } from "./js/islands/underworld/atlas.js";   // the Atlas of Last Voyages (hall.js: the old office, unused)
import { UnderworldTrials } from "./js/islands/underworld/underworldTrials.js";
import { Crew, reachArm } from "./js/story/crew.js";

const params = new URLSearchParams(location.search);
const world = new World({ quality: params.get("q") || "auto" });
world.grade.uniforms.letterbox.value = 0;
// clarity first (the Atlas redesign): no bloom; the chapter grade (grades.js) is switched off for gameplay
world.noBloom = true; world.applyQuality();
world.renderer.toneMappingExposure = 1.15;

try { await Promise.race([Promise.all([document.fonts.load("40px Anton"), document.fonts.load("bold 40px 'Courier Prime'")]), new Promise(r => setTimeout(r, 2500))]); } catch { /* fonts blocked: fallbacks */ }

const office = buildHall(world);
const pit = new Hall(world, office);              // the queue's seats and the dead in them
const director = new Director(world);
const ui = installUI({ chapter: "underworld", world });  // tokens, loading, VOYAGE, sound (the hum), the MONOCHROME grade
const comic = new Comic(world, director);
const hero = await new Hero(world, { groundY: 0 }).load();
hero.teleport(7.2, 6.4, -2.3);                    // Odysseus just inside the door, by the ticket machine
// the title shot: a wide three-quarter view of the chamber, the astrolabe over the console, the Orbit Gallery in front
const POSTCARD = [[9.5, 6.4, 14.5], [-0.5, 3.6, -3.5], 52];

// ---------- skipping
let skipping = false, filming = false, trialRun = false, trialFast = false;
const skipBtn = document.getElementById("skip"), fastEl = document.getElementById("fast"), lore = document.getElementById("lore");
function skip() { if (trialRun) { if (!trialFast) { trialFast = true; world.timeScale = 8; fastEl.classList.add("on"); } return; } if (!filming || skipping) return; skipping = true; director.skipping = true; world.timeScale = 40; fastEl.classList.add("on"); }
skipBtn.onclick = skip;
addEventListener("keydown", e => { if (e.key === "Escape") skip(); });
async function film(fn, { back = true } = {}) {
  if (filming) return;
  filming = true; skipBtn.classList.add("on"); document.body.classList.add("busy", "cinematic");
  try { await fn(); }
  finally {
    filming = false; skipping = false; director.skipping = false; world.timeScale = 1;
    fastEl.classList.remove("on"); skipBtn.classList.remove("on"); document.body.classList.remove("cinematic");
    if (!trials.el.classList.contains("on")) document.body.classList.remove("busy");
    director.card.classList.remove("on"); world.grade.uniforms.freeze.value = 0; comic.clear(); lore.classList.remove("on");
    if (back) director.cut(...POSTCARD);
  }
}

// ---------- the prologue: typed cards on black, then the office
const LORE = [
  ["Circe let them go. She also told him where to go next."],
  ["Not home. Down."],
  ["The blind prophet Tiresias knows the way back to Ithaca. Tiresias is dead."],
  ["So Odysseus goes to the dead."],
  ["THEY HAVE AN OFFICE.", "red"],
  ["Marble floors. Humming lights. A clock with no hands."],
  ["Everybody takes a number. Kings, slaves, heroes. Achilles took a number."],
  ["You are served in the order you arrived. Nobody pushes in."],
  ["NOBODY.", "red"]
];
async function typeCard(text, cls = "") {
  const p = lore.querySelector("p"); p.className = cls; p.textContent = "";
  const n = text.length, t = cls ? 0.5 : Math.min(2.4, 0.035 * n);
  await pit._tween(t, k => { const c = Math.ceil(n * k); if (c > p.textContent.length && text[c - 1] !== " ") sound.cue("type"); p.textContent = text.slice(0, c); });
  p.textContent = text;
  await pit.wait(cls ? 1.4 : Math.max(1.3, 0.022 * n));
}
// ---- the screenplay's U1–U3 ("Nobody noticed"). U1 replaces cards 1–4; U2–U3 play after the queue caption.
const V3 = (x, y, z) => new THREE.Vector3(x, y, z);
const STAIR_FOOT = V3(9.5, 0, 7.5), STAIR_DIR = V3(9.5, 0, 7.5).normalize(), STAIR_SIDE = V3(-STAIR_DIR.z, 0, STAIR_DIR.x);
const stairY = d => Math.min(1, Math.max(0, (d - 2.75) / 7.2)) * 2.56;          // height on the Descent, d metres out from its foot
const uncaption = () => comic.el.querySelectorAll(".narr").forEach(n => n.remove());   // a cut cancels a caption's own timer
// drive the camera every frame (fn sets o.pos, o.look, o.fov)
function track(fn) {
  let t = 0; const o = { pos: V3(0, 0, 0), look: V3(0, 0, 0), fov: 45 };
  const u = { update: (dt, time, raw) => { t += director.skipping ? dt : raw; fn(t, o); director.mode = null; director.cam.position.copy(o.pos); director.look.copy(o.look); director.setFov(o.fov); director.cam.lookAt(o.look); } };
  world.add(u); return { stop() { const i = world.updaters.indexOf(u); if (i >= 0) world.updaters.splice(i, 1); } };
}
// U1 · the Descent: from the top of the stair, looking down into the Atlas. He comes past us and goes down; his crew
// stay at the top, and one raises a hand.
async function descent() {
  const crew = await Crew.ready(world, hero);
  const top = d => STAIR_FOOT.clone().addScaledVector(STAIR_DIR, d).setY(stairY(d));
  const men = [["Polites", 0xd6cdbd, 2.2], ["Eurylochus", 0xb8ae9c, -2.3], ["Perimedes", 0xc4b8a4, -2.6]].map(([name, tint, sd], i) => {
    const m = crew.add({ name, tint }); const p = top(i === 2 ? 12.2 : 11.3).addScaledVector(STAIR_SIDE, sd);      // at the edges of the frame
    m.place(p.x, p.y, p.z); m.face(0, -4); return m;
  });
  let wave = 0;
  const waving = { update: () => { const m = men[0]; if (wave > 0) { m.group.updateMatrixWorld(); reachArm(m.bones, "r", V3(-0.2, 2.2, 0.3).applyMatrix4(m.group.matrixWorld), wave); } } };
  world.add(waving);
  const cam = track((t, o) => { const k = Math.min(1, t / 8); o.pos.copy(top(12.9)).add(V3(0, 2.5 - 0.3 * k, 0)); o.look.set(0, 1.6 + 0.4 * k, -6); o.fov = 52 - 4 * k; });
  try {
    hero.group.position.copy(top(13.3)); hero.group.rotation.y = Math.atan2(-STAIR_DIR.x, -STAIR_DIR.z); hero.play("walk", 0.1);
    const walk = pit._tween(6.4, k => { const d = 13.3 - 11.3 * k; hero.group.position.copy(top(d)); });
    await pit.wait(0.8);
    comic.caption("Not home. Down.", { x: 6, y: 16, seconds: 2.4 });
    await pit.wait(1.8);
    await pit._tween(0.5, k => wave = k * k * (3 - 2 * k));
    comic.caption("The blind prophet Tiresias knows the way back to Ithaca. Tiresias is dead.", { x: 6, y: 16, seconds: 3.6 });
    await walk; hero.play("idle", 0.3);
    await pit._tween(0.5, k => wave = 1 - k);
    await pit.wait(0.9);
  } finally {
    cam.stop(); uncaption();
    const i = world.updaters.indexOf(waving); if (i >= 0) world.updaters.splice(i, 1);
    crew.dispose();
  }
}
// the soul at the front of the line wearing ticket 7, and the red cord on his wrist (made once, kept on him)
function front7() { for (const s of Object.values(pit.souls)) if (s.v === 7) return s; return null; }
function cordOn(fig) {
  if (fig.userData.cord) return fig.userData.cord;
  const cord = new THREE.Mesh(new THREE.TorusGeometry(0.062, 0.017, 6, 16), new THREE.MeshStandardMaterial({ color: 0xb3121a, roughness: 0.6 }));
  cord.position.set(0.31, 0.97, 0.36); cord.rotation.set(-0.75 + Math.PI / 2, 0, -0.25); fig.add(cord); fig.userData.cord = cord; return cord;
}
// U2 · past the line, and U3 · the front of the line
async function frontOfTheLine() {
  const s7 = front7(); if (!s7) return;                                  // (the line always starts 7, 12, 30: guard anyway)
  const F = s7.fig.position.clone().setY(0), out = F.clone().normalize();
  const meet = F.clone().addScaledVector(out, 1.25);                      // facing him, just outside the ring
  cordOn(s7.fig);
  // the brass arm: a post by the station and an arm that swings across his path and stops at his chest
  const brass = new THREE.MeshStandardMaterial({ color: 0xb08a3e, metalness: 0.8, roughness: 0.35 });
  const side = V3(-out.z, 0, out.x);
  const post = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.09, 1.5, 10), brass); post.position.copy(meet).addScaledVector(side, 0.95).addScaledVector(out, -0.35).setY(0.75);
  const hinge = new THREE.Group(); hinge.position.copy(post.position).setY(1.32);
  const bar = new THREE.Mesh(new THREE.BoxGeometry(0.07, 0.07, 1.35), brass); bar.position.z = 0.67; hinge.add(bar);
  const yawAcross = Math.atan2(-side.x, -side.z), yawUp = yawAcross;        // swung back along the post, then across
  hinge.rotation.set(-Math.PI / 2 + 0.05, yawUp, 0, "YXZ"); world.scene.add(post, hinge);
  const heads = Object.values(pit.souls).map(s => ({ fig: s.fig, y: s.fig.rotation.y }));
  const turning = { update: () => { const H = hero.group.position; for (const h of heads) { if (h.fig === s7.fig) continue; const d = h.fig.position.distanceTo(H); if (d < 3.2) h.fig.lookAt(H.x, h.fig.position.y, H.z); } } };
  world.add(turning);
  let cam = null;
  try {
    // ---- U2 · shoulder height behind him as he walks the line to the front (not to its rear); the shades turn
    const start = hero.group.position.clone();
    cam = track((t, o) => { const P = hero.group.position, yaw = hero.group.rotation.y, f = V3(Math.sin(yaw), 0, Math.cos(yaw)), sd = V3(-f.z, 0, f.x);
      o.pos.copy(P).addScaledVector(f, -2.3).addScaledVector(sd, 0.55).add(V3(0, 1.72, 0)); o.look.copy(P).addScaledVector(f, 3).add(V3(0, 1.35, 0)); o.fov = 50; });
    await hero.walkTo(meet.x + side.x * 0.0, meet.z + side.z * 0.0);
    hero.group.rotation.y = Math.atan2(F.x - meet.x, F.z - meet.z);
    // the Keeper does not look up: the arm swings down across his path and stops at his chest
    sound.op("bell");
    await pit._tween(0.55, k => hinge.rotation.x = (-Math.PI / 2 + 0.05) * (1 - k * k * (3 - 2 * k)));
    await pit.wait(0.6);
    cam.stop();
    // ---- U3 · two-shot; then down the arm of the soul at the front, ticket 7, to the red cord; only then his face
    const mid = meet.clone().lerp(F, 0.5), across = side.clone();
    director.cut([mid.x - across.x * 3.4, 1.7, mid.z - across.z * 3.4], [mid.x, 1.5, mid.z], 40);   // from the side away from the brass post
    await comic.subtitle("Elpenor? You were alive when we sailed.", { speaker: "ODYSSEUS", seconds: 2.6 });
    const cordW = () => s7.fig.userData.cord.getWorldPosition(V3(0, 0, 0)), headW = () => s7.fig.localToWorld(V3(0, 1.8, 0.05));
    // from his side (between the two of them and away from the post), close on the wrist, then up to the face
    const c0 = cordW().addScaledVector(side, -1.25).addScaledVector(out, 0.35).add(V3(0, 0.15, 0));
    cam = track((t, o) => { const k = Math.min(1, t / 3.6), e = k * k * (3 - 2 * k), up = Math.max(0, Math.min(1, (t - 2.2) / 1.6));
      o.pos.copy(c0).addScaledVector(side, 0.4 * e).add(V3(0, 0.75 * up, 0)); o.look.copy(cordW()).lerp(headW(), up * up * (3 - 2 * up)); o.fov = 34 - 6 * e; });
    await pit.wait(3.9);
    await comic.subtitle("I fell off Circe's roof, Captain. The morning you left. Nobody noticed.", { speaker: "ELPENOR", seconds: 3.6 });
    cam.stop(); cam = null;
    // he steps back from the arm, and walks the whole length of the line to the rear: the plinth at the foot of the
    // Descent. The medallion he is given is blank: he is not dead, so it has no number.
    await pit._tween(0.4, k => hinge.rotation.x = (-Math.PI / 2 + 0.05) * (k * k * (3 - 2 * k)));
    const plinth = STAIR_FOOT.clone().addScaledVector(STAIR_SIDE, 2.6), stand = plinth.clone().addScaledVector(STAIR_SIDE, -0.9).addScaledVector(STAIR_DIR, -0.6);
    director.cut([2.5, 3.6, 13.5], [6.5, 1.2, 4.5], 46);
    await hero.walkTo(stand.x, stand.z);
    hero.group.rotation.y = Math.atan2(plinth.x - stand.x, plinth.z - stand.z);
    hero.play("pickup", 0.25);
    await pit.wait(1.0);
    hero.stand && hero.stand(0.4);
  } finally {
    if (cam) cam.stop();
    const i = world.updaters.indexOf(turning); if (i >= 0) world.updaters.splice(i, 1);
    for (const h of heads) h.fig.rotation.y = h.y;
    world.scene.remove(post, hinge); post.geometry.dispose(); bar.geometry.dispose(); brass.dispose();
  }
}
async function opening() {
  await film(async () => {
    office.clearServing();
    await descent();                                                         // cards 1–4, shown, not said
    lore.classList.add("on");
    for (const [text, cls] of LORE.slice(4)) await typeCard(text, cls);      // cards 5–9: the rules of the place
    lore.classList.remove("on");
    director.cut([0, 3.2, 18], [0, 4.2, -10], 50);
    await comic.chapter("CHAPTER FOUR", "THE DEAD TAKE A NUMBER", 2.6);
    await director.glide([3.0, 3.1, 3.0], [0, 5.0, -10], 48, 2.6);        // a controlled push to the route console: the Keeper, his console, the plate over him
    office.setServing(7);
    await director.freeze("THE CLERK", "Has served the dead for three thousand years.<br>Has never once hurried.", 3.0);
    await director.glide([0, 13.5, 9.5], [0, 0, -0.6], 46, 2.6);
    comic.caption("A queue. You join at the REAR. You're served from the FRONT. Nobody cuts in.", { seconds: 3.6 });
    await pit.wait(3.6);
    uncaption();
    await frontOfTheLine();                                                  // U2–U3
    await director.glide([4.6, 2.4, 11.5], [7.6, 1.4, 6.0], 42, 2.0);
    const c = nameCard("underworld");
    await director.freeze(c.name, c.sub, 2.6);
    comic.caption("He took a number like everyone else. He wants to see a dead man about a way home.", { seconds: 3.4 });
    await pit.wait(3.4);
  });
  try { localStorage.setItem("odyssey.underworld.prologue", "1"); } catch { /* storage off */ }
}
document.getElementById("open-btn").onclick = () => opening();
// all nine cards as they used to open the chapter, kept whole as a read
document.getElementById("crawl-btn").onclick = () => film(async () => { lore.classList.add("on"); for (const [text, cls] of LORE) await typeCard(text, cls); lore.classList.remove("on"); });

// ---------- the finale film (after closing time): Tiresias walks out of the ferry door
async function finale() {
  await film(async () => {
    world.grade.uniforms.freeze.value = 0;
    await director.glide([1.5, 2.6, 4.0], [0, 2.4, -3.6], 40, 2.2);
    comic.caption("\"You'll get home. Late, alone, on a stranger's ship, to a house full of strangers.\"", { seconds: 4.0 });
    await pit.wait(4.0);
    uncaption();
    // [new] he doesn't accept it. Tiresias does not answer: he turns his blind face to the station where ticket 7
    // stood (the front, now empty), and walks back out through the gate
    await comic.subtitle("Alone? I have a crew.", { speaker: "ODYSSEUS", seconds: 2.2 });
    director.cut([5.5, 3.2, 6.5], [1.5, 2.0, -6.5], 44);
    await pit.prophetLeaves(pit.seat(0));
    await director.freeze("TIRESIAS", "The blind prophet of Thebes.<br>Dead, and still the only one who can see.", 3.0);
    const c = nameCard("underworld", { done: true });
    await director.glide([4.6, 2.4, 11.5], [7.6, 1.4, 6.0], 42, 1.6);
    await director.freeze(c.name, c.sub, 3.2);
  }, { back: false });
}

// ---------- the three doors (underworldTrials.js runs all three)
const shiftForPanel = () => { const w = innerWidth, h = innerHeight; const lb = document.body.classList.contains("board-on") && document.getElementById("queue-board"); if (w > 900) world.camera.setViewOffset(w, h, panelW() / 2, lb ? Math.round((lb.offsetHeight + 12) / 2) : 0, w, h); else world.camera.clearViewOffset(); };
const START = { capacity: 5, structures: [{ name: "line", kind: "queue", capacity: 5, initial: [7, 12, 30], lengthVar: null }] };
const trials = new UnderworldTrials({
  world, pit, island: office, director, comic,
  panelView: on => {
    if (on) { document.body.classList.add("side-panel", "busy"); shiftForPanel(); addEventListener("resize", shiftForPanel); }
    else { document.body.classList.remove("side-panel"); removeEventListener("resize", shiftForPanel); world.camera.clearViewOffset(); }
  },
  onClose: () => { document.body.classList.remove("busy"); pit.clearProphecy(); office.clearServing(); trials.setUp(START); director.glide(...POSTCARD, 1.2); progress(); },
  onFinale: async () => { trials.ctx.fast.end(); await finale(); ui.regrade(); trials.el.classList.add("on"); trials.ctx.panelView(true); trials.view(true); ui.chapterDone(); },
  skipping: () => trialFast,
  fast: {
    begin: () => { trialRun = true; trialFast = false; skipBtn.textContent = "FAST ▸▸ (Esc)"; skipBtn.classList.add("on"); },
    land: () => { if (trialFast) { trialFast = false; world.timeScale = 1; fastEl.classList.remove("on"); } },
    end: () => { trialRun = false; trialFast = false; fastEl.classList.remove("on"); skipBtn.classList.remove("on"); skipBtn.textContent = "SKIP SCENE ▸▸ (Esc)"; }
  }
});
document.getElementById("door-lesson").onclick = () => trials.openLesson();
document.getElementById("door-trials").onclick = () => trials.open();
document.getElementById("door-lab").onclick = () => trials.openLab();
// the trials in order, as the black cards name them (Java holds the trials; these are only for the gold button)
const ORDER = [["underworld-1", "ONE", "Now Serving"], ["underworld-2", "TWO", "Who Stands at the Front"], ["underworld-3", "THREE", "The Prophet Goes First"], ["underworld-4", "FOUR", "Five Seats"], ["underworld-finale", "CLOSING TIME", "Closing Time"]];
document.querySelectorAll("#doors [data-ic]").forEach(el => el.insertAdjacentHTML("afterbegin", icon(el.dataset.ic) + " "));
function progress() {
  let d = []; try { d = JSON.parse(localStorage.getItem("odyssey.underworld.done")) || []; } catch { /* storage off */ }
  const n = d.filter(id => id.startsWith("underworld-")).length;
  document.getElementById("prog-trials").textContent = n ? `${n} / 5 done${d.includes("underworld-finale") ? " · Tiresias has spoken" : ""}` : "5 trials · start with ONE";
  // the gold button (shared with every chapter): back into the trials once they are started, otherwise the prologue
  const next = ORDER.find(([id]) => !d.includes(id)), cont = document.getElementById("continue-btn");
  if (n && next) { cont.innerHTML = `CONTINUE ${icon("arrow")} <small>${next[1]} · ${next[2]}</small>`; cont.onclick = () => { if (!filming) trials.open(); }; }
  else { cont.innerHTML = `${icon("play")} PLAY SCENE <small>the prologue</small>`; cont.onclick = () => { if (!filming) opening(); }; }
}
progress();

trials.setUp(START);
director.cut(...POSTCARD);

// ---------- start
const loading = document.getElementById("loading");
if (params.get("capture")) {
  loading.remove();
  world.resize(); world.step(0.016);
  window.__advance = async s => { const n = Math.round(s / (1 / 30)); for (let i = 0; i < n; i++) { world.step(1 / 30, i === n - 1); await new Promise(r => setTimeout(r, 0)); } };
  window.__world = world; window.__pit = pit; window.__office = office; window.__director = director; window.__trials = trials; window.__opening = opening; window.__finale = finale; window.__skip = skip;
  window.__ready = true;
} else {
  world.start();
  loading.style.opacity = 0; setTimeout(() => loading.remove(), 1000);
  let seen = false; try { seen = !!localStorage.getItem("odyssey.underworld.prologue"); } catch { /* storage off */ }
  if (params.get("opening") || (!seen && !params.get("trials") && !params.get("lab") && !params.get("lesson"))) opening();
  else if (params.get("trials")) trials.open();
  else if (params.get("lab")) trials.openLab();
  else if (params.get("lesson")) trials.openLesson();
}

</script>
</body>
</html>
