<!DOCTYPE html>
<html lang="en">
<head>
<script>
// opened from IntelliJ's built-in preview (port 63342)? That server has no game API (every call answers 404).
// Jump to the same page on Spring Boot instead.
if (location.port === "63342") { const page = location.pathname.split("/static/")[1] || ""; location.replace("http://localhost:8081/" + page + location.search); }
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Cave of Polyphemus</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #050403; color: #e9e4da; font-family: 'Courier Prime', monospace; }
  canvas { display: block; }
  #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: #050403; z-index: 40; transition: opacity 1s; }
  #loading h1 { margin: 0; font-family: Anton, Impact, sans-serif; font-weight: 400; letter-spacing: 4px; font-size: 30px; color: #f2c230; }
  #loading p { margin: 0; color: #8a979b; font-size: 15px; }
  #skip { position: fixed; right: 18px; bottom: 16px; z-index: 35; min-height: 40px; padding: 0 16px; background: rgba(8, 6, 4, 0.75); color: #efe1c2;
          border: 1px solid #4a3a28; border-radius: 4px; font-family: 'Courier Prime', monospace; font-size: 13px; letter-spacing: 1px; cursor: pointer; display: none; }
  #skip.on { display: block; }
  @media (min-width: 901px) { body.board-on #skip { right: calc(var(--pw, 520px) + 20px); bottom: calc(var(--board-h, 210px) + 22px); } }
  #fast { position: fixed; inset: 0; z-index: 34; background: #050403; display: none; align-items: center; justify-content: center;
          font-family: Anton, Impact, sans-serif; font-size: 34px; letter-spacing: 6px; color: #f2c230; }
  #fast.on { display: flex; }
</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three/build/three.module.js", "three/addons/": "./vendor/three/examples/jsm/" } }
</script>
</head>
<body>
<div id="loading"><h1>THE CAVE OF POLYPHEMUS</h1><p>carving the pens…</p></div>
<div id="title" class="odx-title"><span class="k">CHAPTER TWO</span><span class="t">The Cave of Polyphemus</span></div>
<button id="skip">SKIP SCENE ▸▸ (Esc)</button>
<div id="fast">▸▸</div>
<nav id="doors" class="odx-doors" aria-label="Chapter two">
  <button class="continue" id="continue-btn" hidden></button>
  <div class="row">
    <button class="door lesson" id="door-lesson"><span class="kick" data-ic="book">LEARN</span><span class="name">ATHENA'S LESSON</span>
      <span class="what">Four short parts on the pens: what an array is, walking it, making room and closing gaps, turning it around. Nothing is graded.</span><span class="prog" id="prog-lesson">4 parts</span></button>
    <button class="door trials" id="door-trials"><span class="kick" data-ic="sun">BE JUDGED</span><span class="name">ATHENA'S TRIALS</span>
      <span class="what">Noon to dawn: eight hours of work on the flock, a bonus at midnight, and the escape at dawn.</span><span class="prog" id="prog-trials"></span></button>
    <button class="door lab" id="door-lab"><span class="kick" data-ic="flask">PLAY</span><span class="name">THE LAB</span>
      <span class="what">No giant, no clock. Your flock, your code, any array algorithm, step by step.</span><span class="prog">up to 10 sheep</span></button>
  </div>
  <div class="extra">
    <span class="lbl">STORY</span><button id="open-btn" data-ic="film">Opening</button><button id="crawl-btn" data-ic="scroll">The story so far</button><button id="climax-btn" data-ic="film">Climax</button>
    <span class="lbl">LESSON</span><button data-part="1">1 Pens</button><button data-part="2">2 Walking</button><button data-part="3">3 Room &amp; gaps</button><button data-part="4">4 Turning around</button>
    <span class="lbl">ARRANGE</span><button data-arrange="traverse">Sum</button><button data-arrange="insert">Insert</button><button data-arrange="delete">Delete</button><button data-arrange="reverse">Reverse</button>
    <button id="codex-btn" data-ic="scroll">Codex</button>
  </div>
</nav>

<script type="module">
import * as THREE from "three";
import { World } from "./js/engine/world.js";
import { panelW } from "./js/learn/panelWidth.js";
import { Director } from "./js/engine/director.js";
import { sound } from "./js/engine/sound.js";
import { installUI } from "./js/ui/ui.js";
import { icon } from "./js/ui/icons.js";
import { PenRow, PEN_W } from "./js/islands/cave/penRow.js";
import { caveLesson } from "./js/islands/cave/caveLesson.js";
import { Parsons, CAVE_PARSONS } from "./js/learn/parsons.js";
import { buildCave, GIANT_AT } from "./js/islands/cave/caveScene.js";
import { addCaveDetails } from "./js/islands/cave/caveDetails.js";
import { Cyclops } from "./js/islands/cave/cyclops.js";
import { Hero } from "./js/engine/hero.js";
import { Comic } from "./js/engine/comic.js";
import { playCaveOpening, playCaveCrawl } from "./js/islands/cave/caveOpening.js";
import { playCaveClimax } from "./js/islands/cave/caveClimax.js";
import { nameCard } from "./js/story/tags.js";
import { FIRE_AT } from "./js/islands/cave/caveScene.js";
import { CaveTrials } from "./js/islands/cave/caveTrials.js";

const params = new URLSearchParams(location.search);
const world = new World({ quality: params.get("q") || "auto" });
world.bloom.strength = 0.3; world.bloom.threshold = 0.9;     // fire glows, but never blooms over the numbers
world.grade.uniforms.letterbox.value = 0;   // no cinema bars while learning

// ---------- the cave itself (caveScene.js), and Polyphemus dozing at the back by his cheeses
const scene = world.scene;
const cave = await buildCave(world);
cave.details = addCaveDetails(world, cave);                          // the lived-in details: threshold, pen wall, his corner, the deep cave, moonlight
const giant = new Cyclops(world, { height: 11 });
await giant.load();
giant.place(GIANT_AT.x, 0, GIANT_AT.z, 8, 4); giant.play("idle", 0); giant.open(0.25);   // dozing: one eye, barely open

const pens = new PenRow(world, { pens: 10 });
// the resting shot: the whole pen row, set high in the frame so the doors at the bottom never cover it
const REST = [[PEN_W * 4.5, 5.0, 14.5], [PEN_W * 4.5, -0.35, 0], 44];
pens.set([34, 52, 18, 77, 45, 60, 23, 81]);
const director = new Director(world);
const ui = installUI({ chapter: "cave", world });        // tokens, loading, VOYAGE, sound, the EMBER grade
const comic = new Comic(world, director);
// Odysseus: by the fire while Athena teaches (the opening walks him in)
const hero = await new Hero(world, { groundY: 0 }).load();
hero.teleport(FIRE_AT.x + 1.7, FIRE_AT.z + 1.9, 2.4);

// ---------- the giant is felt even while you work: every half-minute or so, a slow breath from the dark
// at the back, his head stirs, and one sheep shifts its weight in its pen. Never during a film or a fast run.
{
  let next = 20 + Math.random() * 15, stir = 0;
  world.add({ update(dt) {
    if (document.body.classList.contains("filming") || world.timeScale > 1.5) return;
    next -= dt;
    if (stir > 0) { stir = Math.max(0, stir - dt); giant.roar(0.05 * Math.sin(Math.PI * (1 - stir / 2.4))); if (!stir) giant.roar(0); }
    if (next > 0) return;
    next = 25 + Math.random() * 20; stir = 2.4;
    sound.giant("breath", { level: 0.7 });
    const live = pens.sheep.filter(Boolean), sh = live[Math.floor(Math.random() * live.length)];
    if (sh) { const r = sh.rotation.y; pens.over(0.8, k => { sh.rotation.y = r + Math.sin(Math.PI * k) * 0.25; }).then(() => (sh.rotation.y = r)); }
  } });
}

// ---------- the opening film (caveOpening.js), and skipping it: fast-forward behind a black card
let skipping = false, filming = false;
const skipBtn = document.getElementById("skip"), fastEl = document.getElementById("fast");
function skip() { if (trialRun) { if (!trialFast) { trialFast = true; world.timeScale = 8; fastEl.classList.add("on"); } return; } if (!filming || skipping) return; skipping = true; director.skipping = true; world.timeScale = 40; fastEl.classList.add("on"); }
skipBtn.onclick = skip;
addEventListener("keydown", e => { if (e.key === "Escape") skip(); });
async function opening() {
  if (filming) return;
  filming = true; skipBtn.classList.add("on"); document.body.classList.add("busy");
  document.body.classList.add("filming");
  try { await playCaveOpening({ world, hero, director, comic, giant, cave, pens, card: nameCard("cyclops"), noCrawl: !!params.get("nocrawl") }); }
  finally {
    filming = false; skipping = false; director.skipping = false; world.timeScale = 1; document.body.classList.remove("filming"); ui.regrade();
    fastEl.classList.remove("on"); skipBtn.classList.remove("on"); document.body.classList.remove("busy");
    director.card.classList.remove("on"); world.grade.uniforms.freeze.value = 0;
    director.cut(...REST);
  }
}
document.getElementById("open-btn").onclick = () => opening();
// the crawl that used to open the chapter, kept whole as a read: the arrival scene now carries the story
document.getElementById("crawl-btn").onclick = async () => {
  if (filming) return;
  filming = true; skipBtn.classList.add("on"); document.body.classList.add("busy", "filming");
  try { await playCaveCrawl({ comic }); }
  finally { filming = false; skipping = false; director.skipping = false; world.timeScale = 1; fastEl.classList.remove("on"); skipBtn.classList.remove("on"); document.body.classList.remove("busy", "filming"); }
};
async function climax() {
  if (filming) return;
  filming = true; skipBtn.classList.add("on"); document.body.classList.add("busy");
  document.body.classList.add("filming");
  try { await playCaveClimax({ world, hero, director, comic, giant, cave, pens, cardAfter: nameCard("cyclops", { done: true }) }); }
  finally {
    filming = false; skipping = false; director.skipping = false; world.timeScale = 1; document.body.classList.remove("filming"); ui.regrade();
    fastEl.classList.remove("on"); skipBtn.classList.remove("on"); document.body.classList.remove("busy");
    director.card.classList.remove("on"); world.grade.uniforms.freeze.value = 0;
    director.cut(...REST);
  }
}
document.getElementById("climax-btn").onclick = () => climax();

// ---------- Athena's trials (caveTrials.js): the panel on the right, the pens on the left
let trialRun = false, trialFast = false;
// the side panel takes 460px on the right; the array board, when open, about 230px at the bottom:
// shift the picture so its centre sits in the space that's left
const shiftForPanel = () => { const w = innerWidth, h = innerHeight; if (w > 900) world.camera.setViewOffset(w, h, panelW() / 2, document.body.classList.contains("board-on") ? 112 : 0, w, h); else world.camera.clearViewOffset(); };
const trials = new CaveTrials({
  world, pens, director, comic,
  panelView: on => {
    if (on) { document.body.classList.add("side-panel", "busy"); shiftForPanel(); addEventListener("resize", shiftForPanel); }
    else { document.body.classList.remove("side-panel"); removeEventListener("resize", shiftForPanel); world.camera.clearViewOffset(); }
  },
  onClose: () => { document.body.classList.remove("busy"); director.glide(...REST, 1); refreshMenu(); },
  onLesson: () => { trials.close(); lesson(1); },
  onFinale: async () => { trials.ctx.fast.end(); await climax(); trials.el.classList.add("on"); trials.ctx.panelView(true); trials.view(true); ui.chapterDone(); },
  skipping: () => trialFast,
  fast: {
    begin: () => { trialRun = true; trialFast = false; skipBtn.textContent = "FAST ▸▸ (Esc)"; skipBtn.classList.add("on"); },
    land: () => { if (trialFast) { trialFast = false; world.timeScale = 1; fastEl.classList.remove("on"); } },
    end: () => { trialRun = false; trialFast = false; fastEl.classList.remove("on"); skipBtn.classList.remove("on"); skipBtn.textContent = "SKIP SCENE ▸▸ (Esc)"; }
  }
});
document.getElementById("door-trials").onclick = () => trials.open();
document.getElementById("door-lab").onclick = () => trials.openLab();
director.cut(...REST);

// ---------- the menu (Chapter Three's doors, in stone): CONTINUE, LEARN, BE JUDGED, PLAY, and the small buttons
const LESSONS_KEY = "odyssey.cave.lessons";
const seenParts = () => { try { return JSON.parse(localStorage.getItem(LESSONS_KEY)) || []; } catch { return []; } };
const markPart = n => { try { const s = seenParts(); if (!s.includes(n)) { s.push(n); localStorage.setItem(LESSONS_KEY, JSON.stringify(s)); } } catch { /* storage off */ } };
let menuBusy = false;                                   // one thing at a time: a second click while something opens is ignored
async function busy(fn, btn) {
  if (menuBusy) return; menuBusy = true;
  document.body.classList.add("busy");
  try { await fn(); } finally {
    menuBusy = false;
    document.body.classList.remove("busy");
    if (btn) btn.classList.add("seen");
    director.glide(...REST, 1);
    refreshMenu();
  }
}
async function lesson(part, btn) {
  await busy(async () => {
    const player = caveLesson(part, { pens, director });
    window.__lesson = player;
    const r = await player.open();
    if (r && !r.skipped) markPart(part);
    pens.clearMarkers(); pens.set([34, 52, 18, 77, 45, 60, 23, 81]);            // the lesson leaves the flock as it found it
  }, btn || document.querySelector(`#doors [data-part="${part}"]`));
}
async function arrange(name, btn) {
  await busy(async () => {
    const p = new Parsons({ title: "Arrange the lines · " + name, ...CAVE_PARSONS[name] });
    window.__parsons = p;
    await p.open();
  }, btn);
}
document.querySelectorAll("#doors [data-part]").forEach(b => b.onclick = () => lesson(+b.dataset.part, b));
document.querySelectorAll("#doors [data-arrange]").forEach(b => b.onclick = () => arrange(b.dataset.arrange, b));
document.querySelectorAll("#doors [data-ic]").forEach(el => el.insertAdjacentHTML("afterbegin", icon(el.dataset.ic) + " "));
document.getElementById("door-lesson").onclick = () => { const s = seenParts(); lesson([1, 2, 3, 4].find(n => !s.includes(n)) || 1); };
document.getElementById("codex-btn").onclick = async () => { await trials.open(); trials.codex.show(true); };

// what the doors say, from what is saved: lessons seen, trials done, and where CONTINUE goes
const HOUR_OF = { "cave-1": "NOON", "cave-2": "1 PM", "cave-3": "2 PM", "cave-4": "3 PM", "cave-5": "4 PM", "cave-6": "5 PM", "cave-7": "6 PM", "cave-8": "7 PM", "cave-bonus": "MIDNIGHT", "cave-finale": "DAWN" };
const TITLE_OF = { "cave-1": "Count the Flock", "cave-2": "Where's the Black Ram?", "cave-3": "The Biggest Ram", "cave-4": "Too Thin to Hide a Man", "cave-5": "Two Lambs Born",
  "cave-6": "First Out at Dawn", "cave-7": "The Cyclops' Supper", "cave-8": "Back to Front", "cave-bonus": "The Sorted Line", "cave-finale": "Dawn" };
function refreshMenu() {
  let d = []; try { d = JSON.parse(localStorage.getItem("odyssey.cave.done")) || []; } catch { /* storage off */ }
  d = d.filter(id => id in HOUR_OF);
  const practice = ["cave-1", "cave-2", "cave-3", "cave-4", "cave-5", "cave-6", "cave-7", "cave-8"];
  const finished = d.includes("cave-finale");
  const next = practice.find(id => !d.includes(id)) || (finished ? null : "cave-finale");
  const pt = document.getElementById("prog-trials");
  pt.textContent = finished ? `${d.length} / 10 done · the men are out` : d.length ? `${d.length} / 10 done · next: ${HOUR_OF[next]}` : "10 trials · start at NOON";
  pt.classList.toggle("done", finished);
  const s = seenParts(), pl = document.getElementById("prog-lesson");
  pl.textContent = s.length >= 4 ? "4 / 4 parts seen" : s.length ? `${s.length} / 4 parts seen · next: part ${[1, 2, 3, 4].find(n => !s.includes(n))}` : "4 parts · start with 1";
  pl.classList.toggle("done", s.length >= 4);
  // CONTINUE only when there is something real to go back to: a trial started but the chapter not finished
  const cont = document.getElementById("continue-btn");
  cont.hidden = !(d.length && next);
  if (!cont.hidden) cont.innerHTML = `CONTINUE ${icon("arrow")} <small>${HOUR_OF[next]} · ${TITLE_OF[next]}</small>`;
}
document.getElementById("continue-btn").onclick = () => trials.open();
refreshMenu();

// ---------- start: the world runs on the real clock, or (capture=1) only when a test steps it
const loading = document.getElementById("loading");
if (params.get("capture")) {
  loading.remove();
  world.resize();
  world.step(0.016);
  window.__advance = async s => { const n = Math.round(s / (1 / 30)); for (let i = 0; i < n; i++) { world.step(1 / 30, i === n - 1); await new Promise(r => setTimeout(r, 0)); } };
  window.__world = world; window.__pens = pens; window.__cave = cave; window.__giant = giant; window.__director = director; window.__lessonPart = lesson; window.__arrange = arrange; window.__opening = opening; window.__climax = climax; window.__hero = hero; window.__skip = skip; window.__trials = trials;
  window.__ready = true;
} else {
  world.start();
  loading.style.opacity = 0; setTimeout(() => loading.remove(), 1000);
  const part = params.get("part"); if (part) lesson(+part);
  if (params.get("opening")) opening();
  if (params.get("climax")) climax();
  if (params.get("trials")) trials.open();
  if (params.get("lab")) trials.openLab();
}
</script>
</body>
