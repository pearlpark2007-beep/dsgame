<!DOCTYPE html>
<html lang="en">
<head>
<script>
// opened from IntelliJ's built-in preview (port 63342)? That server has no game API (every call answers 404).
// Jump to the same page on Spring Boot instead.
if (location.port === "63342") { const page = location.pathname.split("/static/")[1] || ""; location.replace("http://localhost:8081/" + page + location.search); }
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Circe's Island</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root { --sun: #ffd21a; --ink: #141008; --blood: #c8261e; --cobalt: #1d3fd1; --paper: #f4ead2; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #050403; color: var(--paper); font-family: 'Courier Prime', monospace; }
  canvas { display: block; }
  #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: var(--sun); z-index: 40; transition: opacity 1s; }
  #loading h1 { margin: 0; font-family: Anton, Impact, sans-serif; font-weight: 400; letter-spacing: 4px; font-size: 34px; color: var(--ink); }
  #loading p { margin: 0; color: var(--ink); font-size: 15px; }

  /* the chapter mark: Kill Bill black bands on a bright picture */
  #title { position: fixed; left: 0; top: 7%; z-index: 10; pointer-events: none; display: flex; flex-direction: column; align-items: flex-start; gap: 6px; transition: opacity 0.6s; }
  #title span { background: var(--ink); padding: 4px 18px 4px max(18px, 4vw); }
  #title .k { font-size: 15px; letter-spacing: 4px; color: var(--paper); }
  #title .t { font-family: Anton, Impact, sans-serif; font-size: clamp(34px, 5vw, 60px); line-height: 1.05; color: var(--sun); letter-spacing: 1px; }
  #title .t em { font-style: normal; color: var(--blood); }

  /* three doors: three colours, three jobs */
  #doors { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; padding: 0 max(16px, 3vw) 18px; display: flex; flex-direction: column; gap: 10px; transition: opacity 0.6s; }
  #doors .row { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
  .door { position: relative; text-align: left; border: 0; border-top: 10px solid var(--c); background: rgba(14, 10, 7, 0.92); color: var(--paper); padding: 14px 16px 16px; cursor: pointer;
          font: inherit; display: flex; flex-direction: column; gap: 6px; min-height: 150px; transition: transform 0.15s, box-shadow 0.15s; box-shadow: 6px 6px 0 var(--ink); }
  .door:hover, .door:focus-visible { transform: translate(-2px, -3px); box-shadow: 9px 10px 0 var(--ink); outline: none; }
  .door:focus-visible { outline: 3px solid var(--paper); outline-offset: 2px; }
  .door .kick { font-size: 12px; letter-spacing: 3px; color: var(--c); font-weight: 700; }
  .door .name { font-family: Anton, Impact, sans-serif; font-size: clamp(26px, 2.8vw, 38px); line-height: 1; letter-spacing: 1px; }
  .door .what { font-size: 14px; line-height: 1.4; color: #d8ccb2; }
  .door .prog { margin-top: auto; font-size: 12.5px; color: var(--c); font-weight: 700; letter-spacing: 1px; }
  .door.lesson { --c: #3b62ff; } .door.trials { --c: var(--blood); } .door.lab { --c: var(--sun); }
  #doors .extra { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #doors .extra button, #doors .extra a { min-height: 36px; padding: 0 14px; background: var(--ink); color: var(--paper); border: 2px solid var(--ink); font: inherit; font-size: 13px;
          letter-spacing: 1px; cursor: pointer; display: inline-flex; align-items: center; text-decoration: none; box-sizing: border-box; }
  #doors .extra button:hover, #doors .extra a:hover, #doors .extra :focus-visible { border-color: var(--sun); color: var(--sun); outline: none; }
  #doors .extra .lbl { font-size: 11px; letter-spacing: 2px; color: var(--ink); background: var(--sun); padding: 2px 8px; font-weight: 700; }
  @media (max-width: 760px) { #doors .row { grid-template-columns: minmax(0, 1fr); } .door { min-height: 0; } .door .what { display: none; } }

  body.busy #doors, body.busy #title { opacity: 0; pointer-events: none; }
  body.cinematic #doors, body.cinematic #title { display: none; }

  /* the prologue: typed title cards on black */
  #lore { position: fixed; inset: 0; z-index: 33; background: #050403; display: none; flex-direction: column; justify-content: center; padding: 0 12vw; pointer-events: none; }
  #lore.on { display: flex; }
  #lore p { margin: 0; max-width: 46ch; font-family: 'Courier Prime', monospace; font-weight: 700; font-size: clamp(22px, 2.7vw, 38px); line-height: 1.35; color: var(--paper); min-height: 2.7em; }
  #lore p.red { font-family: Anton, Impact, sans-serif; font-weight: 400; font-size: clamp(44px, 7vw, 96px); letter-spacing: 2px; color: var(--blood); line-height: 1; }
  #lore p::after { content: "▌"; color: var(--sun); animation: blink 0.8s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { #lore p::after { animation: none; } .door { transition: none; } }

  #skip { position: fixed; right: 18px; bottom: 16px; z-index: 35; min-height: 40px; padding: 0 16px; background: rgba(8, 6, 4, 0.8); color: var(--paper);
          border: 1px solid #4a3a28; border-radius: 4px; font-family: 'Courier Prime', monospace; font-size: 13px; letter-spacing: 1px; cursor: pointer; display: none; }
  #skip.on { display: block; }
  @media (min-width: 901px) { body.board-on #skip { right: calc(var(--pw, 520px) + 20px); bottom: calc(var(--board-h, 210px) + 22px); } }
  #fast { position: fixed; inset: 0; z-index: 34; background: #050403; display: none; align-items: center; justify-content: center;
          font-family: Anton, Impact, sans-serif; font-size: 34px; letter-spacing: 6px; color: var(--sun); }
  #fast.on { display: flex; }
</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three/build/three.module.js", "three/addons/": "./vendor/three/examples/jsm/" } }
</script>
</head>
<body>
<div id="loading"><h1>AEAEA · HIGH NOON</h1><p>polishing the marble…</p></div>
<div id="title"><span class="k">CHAPTER THREE</span><span class="t">THE WITCH WHO <em>KEPT PIGS</em></span></div>
<div id="lore" aria-live="polite"><p></p></div>
<button id="skip">SKIP SCENE ▸▸ (Esc)</button>
<div id="fast">▸▸</div>
<nav id="doors" aria-label="Chapter three">
  <div class="row">
    <button class="door lesson" id="door-lesson"><span class="kick">LEARN</span><span class="name">ATHENA'S LESSON</span>
      <span class="what">The ten operations of your linked-list program. Your C runs on the pigs, line by line. Nothing is graded.</span><span class="prog" id="prog-lesson">10 operations</span></button>
    <button class="door trials" id="door-trials"><span class="kick">BE JUDGED</span><span class="name">CIRCE'S TRIALS</span>
      <span class="what">Five tests and the banquet at sunset. Get a pointer wrong and a man stays a pig.</span><span class="prog" id="prog-trials"></span></button>
    <button class="door lab" id="door-lab"><span class="kick">PLAY</span><span class="name">THE LAB</span>
      <span class="what">No judge, no story. Your rope, your code, any of your ten functions.</span><span class="prog">up to 8 pigs</span></button>
  </div>
  <div class="extra"><button id="open-btn">▶ PROLOGUE</button></div>
</nav>

<script type="module">
import * as THREE from "three";
import { World } from "./js/engine/world.js";
import { panelW } from "./js/learn/panelWidth.js";
import { Director } from "./js/engine/director.js";
import { sound } from "./js/engine/sound.js";
import { installUI } from "./js/ui/ui.js";
import { Comic } from "./js/engine/comic.js";
import { Hero } from "./js/engine/hero.js";
import { nameCard } from "./js/story/tags.js";
import { Sty, GATE } from "./js/islands/circe/sty.js";
import { buildIsland } from "./js/islands/circe/helios.js";
import { CirceTrials } from "./js/islands/circe/circeTrials.js";

// Aeaea has sound again, quietly: the sea, Circe's loudspeakers, ropes pulled tight. One button turns it all off.
const params = new URLSearchParams(location.search);
const world = new World({ quality: params.get("q") || "auto" });
world.noBloom = true; world.applyQuality();      // no glow: on the bright plaza it washed every node into haze
world.grade.uniforms.letterbox.value = 0;
world.grade.uniforms.keepBlue.value = 0.85;     // keep Circe's cobalt
world.grade.uniforms.halo.value = 0.0;          // noon: clear air, no glow bleeding round every white thing
world.grade.uniforms.strength.value = 0.45;     // only a little of the film print: the colours stay clean and sharp
world.grade.uniforms.grain.value = 0.025;
world.renderer.toneMappingExposure = 1.0;
if (world.grade.uniforms.burn) world.grade.uniforms.burn.value = 0.12;  // hardly any burn at the edges: it is the brightest island

// canvas labels (the plaques, the head sign) are drawn with Anton / Courier Prime: wait for them, briefly
try { await Promise.race([Promise.all([document.fonts.load("40px Anton"), document.fonts.load("bold 40px 'Courier Prime'")]), new Promise(r => setTimeout(r, 2500))]); } catch { /* fonts blocked: fallbacks */ }

const island = buildIsland(world);
// sunset for the banquet: dusk(to, seconds) eases the island from noon to dusk (or back)
let duskTween = null;
world.add({ update: dt => {
  if (!duskTween) return;
  duskTween.t += dt; const k = Math.min(1, duskTween.t / duskTween.d), e = k * k * (3 - 2 * k);
  island.setDusk(duskTween.from + (duskTween.to - duskTween.from) * e);
  if (k >= 1) duskTween = null;
} });
function dusk(to, seconds = 0) {
  if (seconds <= 0) { duskTween = null; island.setDusk(to); return; }
  duskTween = { from: island.dusk, to, t: 0, d: seconds };
}
const sty = new Sty(world, island);
const director = new Director(world);
const ui = installUI({ chapter: "circe", world });       // tokens, loading, VOYAGE, sound (the sea), the HELIOS NOON grade
const comic = new Comic(world, director);
const hero = await new Hero(world, { groundY: 0 }).load();
hero.teleport(GATE.x - 0.5, GATE.z + 1.9, Math.PI * 0.5);     // Odysseus at the gate, facing the sty
// the title shot: the palace, Circe against her sun window, the sun machine over the roof
const POSTCARD = [[2, 4.4, 15.5], [2, 7.4, -14], 56];

// ---------- skipping: a black card while the film fast-forwards
let skipping = false, filming = false, trialRun = false, trialFast = false;
const skipBtn = document.getElementById("skip"), fastEl = document.getElementById("fast"), lore = document.getElementById("lore");
function skip() { if (trialRun) { if (!trialFast) { trialFast = true; world.timeScale = 8; fastEl.classList.add("on"); } return; } if (!filming || skipping) return; skipping = true; director.skipping = true; world.timeScale = 40; fastEl.classList.add("on"); }
skipBtn.onclick = skip;
addEventListener("keydown", e => { if (e.key === "Escape") skip(); });
async function film(fn, { back = true } = {}) {
  if (filming) return;
  filming = true; skipBtn.classList.add("on"); document.body.classList.add("busy", "cinematic");
  try { await fn(); }
  finally {
    filming = false; skipping = false; director.skipping = false; world.timeScale = 1;
    fastEl.classList.remove("on"); skipBtn.classList.remove("on"); document.body.classList.remove("cinematic");
    if (!trials.el.classList.contains("on")) document.body.classList.remove("busy");
    director.card.classList.remove("on"); world.grade.uniforms.freeze.value = 0; comic.clear(); lore.classList.remove("on"); sty.labels(true);
    if (back) director.cut(...POSTCARD);
  }
}

// ---------- the prologue: typed cards on black, then the witch, then the rope
const LORE = [
  ["Twenty-three men walked up the hill."],
  ["One came back down."],
  ["Eurylochus. Sweating. Talking about a house of polished stone, a woman singing at a loom, and wine that smelled like honey."],
  ["He didn't drink it. That's the only reason he still has hands."],
  ["THE OTHERS DID.", "red"],
  ["Now they live in pens. Each one knows exactly one thing: where the next one is."],
  ["Lose that, and a man is gone for good."],
  ["Odysseus has a sword, a flower from a god, and Athena in his ear."],
  ["He's going to need all three.", "red"]
];
async function typeCard(text, cls = "") {
  const p = lore.querySelector("p"); p.className = cls; p.textContent = "";
  const n = text.length, t = cls ? 0.5 : Math.min(2.4, 0.035 * n);
  await sty._tween(t, k => { p.textContent = text.slice(0, Math.ceil(n * k)); });
  p.textContent = text;
  await sty.wait(cls ? 1.4 : Math.max(1.3, 0.022 * n));
}
async function opening() {
  await film(async () => {
    sty.show(trials.board.frames ? trials.board.frames[0] : sty.frame);
    lore.classList.add("on");
    for (const [text, cls] of LORE) await typeCard(text, cls);
    lore.classList.remove("on");
    director.cut([2, 5.2, 2], [2, 6.4, -13], 44);
    await comic.chapter("CHAPTER THREE", "THE WITCH WHO KEPT PIGS", 2.6);
    await director.glide([2, 5.8, -4.5], [2, 6.6, -13], 40, 2.6);
    await director.freeze("CIRCE", "Daughter of the Sun. Runs her island like a factory.<br>Keeps the crew on a rope, nose to tail.", 3.0);
    await director.glide([-0.6, 14.5, 9.6], [-0.6, 0, -0.5], 44, 2.6);
    comic.caption("Every pig has an address. Every pig knows one address: the next pig's. That's a linked list.", { seconds: 3.6 });
    await sty.wait(3.6);
    await director.glide([GATE.x + 1.1, 2.3, GATE.z + 8.2], [GATE.x + 1.1, 1.4, GATE.z + 0.4], 40, 2.0);   // straight on: Odysseus, the gate and the first pig side by side
    const c = nameCard("circe");
    await director.freeze(c.name, c.sub, 2.6);
    comic.caption("He has the gate. The gate holds the first address: head. Everything else, he has to walk to.", { seconds: 3.4 });
    await sty.wait(3.4);
  });
  try { localStorage.setItem("odyssey.circe.prologue", "1"); } catch { /* storage off */ }
}
document.getElementById("open-btn").onclick = () => opening();

// ---------- the banquet, Act I: the table is laid, Circe asks, Odysseus answers, Athena reads the ration board
async function banquetIntro() {
  if (filming || skipping || trialFast) return;
  trials.el.classList.remove("on"); trials.ctx.panelView(false);
  await film(async () => {
    dusk(0.45, 0);
    director.cut([2, 6.4, 17], [2, 3.0, -8], 44);
    await director.glide([2, 4.2, 5.0], [2, 2.6, -9], 42, 4.2);                  // over the rope to the table and the palace
    director.cut([2, 4.3, 0.8], [2, 4.5, -13], 34);                               // Circe on her terrace, the sun window behind her
    await comic.subtitle("Still counting them?", { speaker: "CIRCE", villain: true, seconds: 2.6 });
    sty.labels(false);                                                              // a close-up: the pigs' tags would fill the frame
    director.cut([GATE.x + 2.6, 2.6, GATE.z + 7.2], [GATE.x - 0.4, 1.4, GATE.z + 1.8], 38);   // Odysseus at the gate
    await comic.subtitle("Making sure I leave with the right number.", { speaker: "ODYSSEUS", seconds: 3.0 });
    sty.labels(true);
    const r = island.rationAt; director.cut([r.x + 4.3, r.y + 0.6, r.z + 7.6], [r.x + 0.2, r.y - 0.4, r.z], 38);   // the board: seven guests tonight
    await comic.subtitle("Two of those aren't ours. Take them off, then turn the rope around.", { speaker: "ATHENA", seconds: 3.6 });
  }, { back: false });
  trials.el.classList.add("on"); trials.ctx.panelView(true); trials.view(true);
}

// ---------- the banquet, Acts V and VI (after MEN AGAIN): the reunion, the rest of the crew, the sun goes down
async function finale() {
  await film(async () => {
    world.grade.uniforms.freeze.value = 0;
    island.setRation("free");
    await director.glide([0.5, 2.3, 7.0], [0.5, 1.7, -2], 44, 2.2);              // low, among the five men on the marble
    await comic.subtitle("…Captain?", { speaker: "POLITES", seconds: 2.0 });
    director.cut([2, 4.3, 0.8], [2, 4.5, -13], 34);
    await comic.subtitle("Take them. All of them.", { speaker: "CIRCE", villain: true, seconds: 2.4 });
    director.cut([2, 7.5, 10], [2, 1.6, -7], 50);                                  // the colonnade opens: seventeen more walk out
    await sty.walkOut(17, island.doorAt, { x0: -4, x1: 7.6, z0: -4.6, dz: 1.0, tableX0: -4.5, tableX1: 8.5, foot: -7.0 });
    await director.glide([1, 3.0, 12.5], [1, 2.6, -8], 50, 2.4);                 // twenty-two men, the palace behind them
    comic.caption("Twenty-two men walked out of Circe's sty. They stayed a year.", { seconds: 3.4 });
    await sty.wait(3.4);
    const c = nameCard("circe", { done: true });
    await director.freeze(c.name, c.sub, 3.2);
    const y0 = island.machine.position.y;                                          // the last image: the sun goes all the way down
    await Promise.all([director.glide([1, 2.2, 5.5], [1, 5.0, -20], 46, 4.2), sty._tween(4.2, k => { island.machine.position.y = y0 - 8 * k * k; })]);
    lore.classList.add("on");
    await typeCard("Home was still a long way off.");
    await typeCard("NEXT: THE UNDERWORLD");
    lore.classList.remove("on");
  }, { back: false });
  // the men stay standing on the marble: the next trial (or the doors) puts the rope back
}

// ---------- the three doors (circeTrials.js runs all three; the mode decides the panel)
const shiftForPanel = () => {
  // the picture is centred in the part of the stage nothing covers: left of the panel, above the rope board, below Athena's Scroll
  const w = innerWidth, h = innerHeight, lb = document.body.classList.contains("board-on") && document.getElementById("list-board");
  const top = typeof trials !== "undefined" && trials.athena ? trials.athena.reserve() : 0, bottom = lb ? lb.offsetHeight + 12 : 0;
  if (w > 900) { world.camera.setViewOffset(w, h, panelW() / 2, Math.round((bottom - top) / 2), w, h); director.insets = { left: 0, right: panelW(), top, bottom }; }
  else { world.camera.clearViewOffset(); director.insets = null; }
};
const trials = new CirceTrials({
  world, sty, island, director, comic, dusk, banquetIntro: () => banquetIntro(),
  panelView: on => {
    if (on) { document.body.classList.add("side-panel", "busy"); shiftForPanel(); addEventListener("resize", shiftForPanel); }
    else { document.body.classList.remove("side-panel"); removeEventListener("resize", shiftForPanel); world.camera.clearViewOffset(); director.insets = null; }
  },
  onClose: () => { document.body.classList.remove("busy"); dusk(0, 1.2); island.banquet(false); trials.setUp({ structures: [{ initial: [7, 12, 3, 19, 5], lengthVar: "head" }] }); director.glide(...POSTCARD, 1.2); progress(); },
  onFinale: async () => { trials.ctx.fast.end(); await finale(); ui.regrade(); trials.el.classList.add("on"); trials.ctx.panelView(true); trials.view(true); ui.chapterDone(); },
  skipping: () => trialFast,
  relayout: () => { if (document.body.classList.contains("side-panel")) shiftForPanel(); },
  fast: {
    begin: () => { trialRun = true; trialFast = false; skipBtn.textContent = "FAST ▸▸ (Esc)"; skipBtn.classList.add("on"); },
    land: () => { if (trialFast) { trialFast = false; world.timeScale = 1; fastEl.classList.remove("on"); } },
    end: () => { trialRun = false; trialFast = false; fastEl.classList.remove("on"); skipBtn.classList.remove("on"); skipBtn.textContent = "SKIP SCENE ▸▸ (Esc)"; }
  }
});
document.getElementById("door-lesson").onclick = () => trials.openLesson();
document.getElementById("door-trials").onclick = () => trials.open();
document.getElementById("door-lab").onclick = () => trials.openLab();
function progress() {
  let d = []; try { d = JSON.parse(localStorage.getItem("odyssey.circe.done")) || []; } catch { /* storage off */ }
  const n = d.filter(id => id.startsWith("circe-")).length;
  document.getElementById("prog-trials").textContent = n ? `${n} / 6 done${d.includes("circe-banquet") ? " · the men are free" : ""}` : "6 trials · start with ONE";
}
progress();

// the starting picture: the crew's rope, and the title shot
trials.setUp({ structures: [{ initial: [7, 12, 3, 19, 5], lengthVar: "head" }] });
director.cut(...POSTCARD);

// ---------- start
const loading = document.getElementById("loading");
if (params.get("capture")) {
  loading.remove();
  world.resize(); world.step(0.016);
  window.__advance = async s => { const n = Math.round(s / (1 / 30)); for (let i = 0; i < n; i++) { world.step(1 / 30, i === n - 1); await new Promise(r => setTimeout(r, 0)); } };
  window.__world = world; window.__sty = sty; window.__director = director; window.__trials = trials; window.__opening = opening; window.__finale = finale; window.__skip = skip;
  window.__ready = true;
} else {
  world.start();
  loading.style.opacity = 0; setTimeout(() => loading.remove(), 1000);
  let seen = false; try { seen = !!localStorage.getItem("odyssey.circe.prologue"); } catch { /* storage off */ }
  if (params.get("opening") || (!seen && !params.get("trials") && !params.get("lab") && !params.get("lesson"))) opening();
  else if (params.get("trials")) trials.open();
  else if (params.get("lab")) trials.openLab();
  else if (params.get("lesson")) trials.openLesson();
}
</script>
</body>
</html>
